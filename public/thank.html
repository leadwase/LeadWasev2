<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadWase — Confirmation</title>
<style>
:root {
  --black:  #0A0A0A;
  --white:  #FFFFFF;
  --off:    #F8F8F6;
  --green:  #1A7A3C;
  --green2: #22A050;
  --green3: #2DC56A;
  --green-light: #E8F5EE;
  --gray1:  #2A2A2A;
  --gray2:  #555555;
  --gray3:  #999999;
  --gray4:  #CCCCCC;
  --gray5:  #EEEEEE;
  --serif: 'Times New Roman', Times, serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--serif);
  background: var(--off);
  color: var(--black);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
}

/* ── Confetti ── */
.confetti-wrap {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  top: -16px;
  width: 8px;
  height: 8px;
  opacity: 0;
  animation: fall linear forwards;
}
@keyframes fall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); }
}

/* ── Header ── */
.header {
  width: 100%;
  background: var(--black);
  border-bottom: 3px solid var(--green);
  padding: 16px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}
.logo {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: bold;
  color: var(--white);
  letter-spacing: 2px;
  text-transform: uppercase;
  text-decoration: none;
}
.logo em { color: var(--green3); font-style: normal; }
.header-step {
  font-size: 11px;
  color: var(--gray3);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header-step span { color: var(--green3); }

/* ── Main ── */
.main-wrap {
  width: 100%;
  max-width: 680px;
  padding: 48px 24px 80px;
  position: relative;
  z-index: 2;
}

/* ── Loader ── */
.loader {
  width: 40px;
  height: 40px;
  border: 3px solid var(--gray5);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Success icon ── */
.success-icon-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 32px;
  animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: .2s;
}
@keyframes popIn {
  from { opacity:0; transform: scale(0.4); }
  to   { opacity:1; transform: scale(1); }
}
.success-circle {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 0 12px rgba(26,122,60,0.1), 0 0 0 24px rgba(26,122,60,0.05);
}
.success-circle svg {
  width: 40px; height: 40px;
  stroke: var(--white); stroke-width: 3;
  fill: none; stroke-linecap: round; stroke-linejoin: round;
}
.check-path {
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  animation: drawCheck .5s ease forwards;
  animation-delay: .6s;
}
@keyframes drawCheck { to { stroke-dashoffset: 0; } }

/* ── Title block ── */
.title-block {
  text-align: center;
  margin-bottom: 36px;
  animation: slideUp .5s ease both;
  animation-delay: .3s;
}
@keyframes slideUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}
.confirm-eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.confirm-eyebrow::before, .confirm-eyebrow::after {
  content: '';
  display: block;
  width: 28px; height: 1px;
  background: var(--green);
}
.confirm-title {
  font-size: clamp(32px, 5vw, 52px);
  font-weight: bold;
  color: var(--black);
  line-height: 1.05;
  letter-spacing: -1px;
  margin-bottom: 12px;
}
.confirm-title em { color: var(--green); font-style: italic; }
.confirm-sub {
  font-size: 16px;
  color: var(--gray2);
  line-height: 1.8;
  font-style: italic;
  max-width: 460px;
  margin: 0 auto;
}

/* ── Order box ── */
.order-box {
  background: var(--white);
  border: 1px solid var(--gray5);
  margin-bottom: 20px;
  animation: slideUp .5s ease both;
  animation-delay: .45s;
}
.order-box-header {
  background: var(--black);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.obh-left {
  font-size: 13px;
  font-weight: bold;
  color: var(--white);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.obh-num {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: var(--green3);
  letter-spacing: 2px;
}
.order-box-body { padding: 28px; }
.order-detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px dotted var(--gray5);
  font-size: 14px;
}
.order-detail-row:last-child { border-bottom: none; }
.odl { color: var(--gray2); }
.odv { font-weight: bold; color: var(--black); }
.odv.green { color: var(--green); }

/* ── Credentials box ── */
.credentials-box {
  background: var(--black);
  padding: 36px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  animation: slideUp .5s ease both;
  animation-delay: .55s;
}
.credentials-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green) 0%, var(--green3) 50%, var(--green) 100%);
}
.cred-title {
  font-size: 14px;
  font-weight: bold;
  color: var(--white);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.cred-sub {
  font-size: 12px;
  color: var(--gray3);
  font-style: italic;
  margin-bottom: 28px;
  line-height: 1.6;
}
.cred-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}
.cred-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 20px;
}
.cred-label {
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gray3);
  margin-bottom: 10px;
}
.cred-value {
  font-family: 'Courier New', monospace;
  font-size: 20px;
  color: var(--green3);
  letter-spacing: 3px;
  font-weight: bold;
  word-break: break-all;
}
.cred-value.pwd {
  font-size: 18px;
  color: var(--white);
  letter-spacing: 2px;
}
.cred-warning {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: rgba(245,166,35,0.08);
  border: 1px solid rgba(245,166,35,0.2);
  padding: 16px;
}
.cred-warning-icon { font-size: 18px; flex-shrink: 0; }
.cred-warning p { font-size: 12px; color: rgba(245,166,35,0.9); line-height: 1.7; }
.cred-warning strong { font-weight: bold; }

/* ── Login CTA box (for orders — not logged in) ── */
.login-cta-box {
  background: var(--white);
  border: 2px solid var(--green);
  padding: 32px 28px;
  margin-bottom: 20px;
  text-align: center;
  animation: slideUp .5s ease both;
  animation-delay: .6s;
  position: relative;
  overflow: hidden;
}
.login-cta-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green), var(--green3));
}
.login-cta-icon { font-size: 40px; margin-bottom: 14px; }
.login-cta-title {
  font-size: 20px;
  font-weight: bold;
  color: var(--black);
  margin-bottom: 8px;
}
.login-cta-sub {
  font-size: 14px;
  color: var(--gray2);
  line-height: 1.7;
  font-style: italic;
  margin-bottom: 24px;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
.login-cta-steps {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 24px;
  text-align: left;
  max-width: 360px;
  margin-left: auto;
  margin-right: auto;
}
.login-cta-step {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 13px;
  color: var(--gray2);
}
.login-cta-step-num {
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--green);
  color: var(--white);
  font-size: 11px;
  font-weight: bold;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
}

/* ── Subscription box ── */
.subscription-box {
  background: linear-gradient(135deg, #1a7a3c 0%, #0d5c2e 100%);
  padding: 36px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  animation: slideUp .5s ease both;
  animation-delay: .55s;
  text-align: center;
}
.subscription-box::before {
  content: '⭐';
  position: absolute;
  top: 10px; right: 20px;
  font-size: 40px;
  opacity: 0.15;
}
.sub-eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.5);
  margin-bottom: 8px;
}
.sub-title {
  font-size: 24px;
  font-weight: bold;
  color: var(--white);
  margin-bottom: 12px;
}
.sub-plan {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  padding: 6px 18px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: bold;
  color: var(--white);
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.sub-message {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  line-height: 1.7;
  margin-bottom: 20px;
  font-style: italic;
}
.sub-features {
  text-align: left;
  display: inline-block;
  margin: 0 auto;
}
.sub-features li {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  padding: 5px 0;
  list-style: none;
}
.sub-features li::before {
  content: '✓';
  margin-right: 10px;
  font-weight: bold;
}

/* ── Redirect bar ── */
.redirect-bar {
  background: var(--black);
  padding: 16px 24px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  animation: slideUp .5s ease both;
  animation-delay: .65s;
}
.redirect-bar-text {
  font-size: 13px;
  color: var(--gray3);
  font-style: italic;
}
.redirect-bar-count {
  font-size: 22px;
  font-weight: bold;
  color: var(--green3);
  font-family: 'Courier New', monospace;
  flex-shrink: 0;
}
.redirect-progress {
  width: 100%;
  height: 3px;
  background: rgba(255,255,255,0.08);
  margin-top: 4px;
}
.redirect-progress-fill {
  height: 100%;
  background: var(--green3);
  transition: width 1s linear;
}

/* ── Next steps ── */
.next-steps {
  background: var(--white);
  border: 1px solid var(--gray5);
  padding: 32px 28px;
  margin-bottom: 20px;
  animation: slideUp .5s ease both;
  animation-delay: .65s;
}
.ns-title {
  font-size: 16px;
  font-weight: bold;
  color: var(--black);
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--gray5);
  display: flex;
  align-items: center;
  gap: 10px;
}
.ns-steps { display: flex; flex-direction: column; gap: 0; }
.ns-step {
  display: flex;
  gap: 18px;
  padding: 16px 0;
  border-bottom: 1px dotted var(--gray5);
  align-items: flex-start;
}
.ns-step:last-child { border-bottom: none; padding-bottom: 0; }
.ns-dot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
}
.ns-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
}
.ns-dot.done { background: var(--green); color: var(--white); }
.ns-dot.pending { background: var(--gray5); color: var(--gray3); }
.ns-dot.waiting { background: var(--black); color: var(--white); }
.ns-line {
  width: 1px;
  flex: 1;
  min-height: 20px;
  background: var(--gray5);
  margin: 4px 0;
}
.ns-content { padding-top: 4px; }
.ns-step-title { font-size: 14px; font-weight: bold; color: var(--black); margin-bottom: 3px; }
.ns-step-desc { font-size: 12px; color: var(--gray2); line-height: 1.7; font-style: italic; }
.ns-step-time {
  display: inline-block;
  margin-top: 4px;
  font-size: 10px;
  color: var(--green);
  font-weight: bold;
  letter-spacing: 0.5px;
  background: var(--green-light);
  padding: 2px 8px;
}

/* ── Delivery box ── */
.delivery-box {
  background: var(--green-light);
  border: 1px solid rgba(26,122,60,0.2);
  border-left: 3px solid var(--green);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  animation: slideUp .5s ease both;
  animation-delay: .7s;
}
.del-icon { font-size: 22px; flex-shrink: 0; }
.del-title { font-size: 14px; font-weight: bold; color: var(--black); margin-bottom: 4px; }
.del-sub { font-size: 12px; color: var(--gray2); line-height: 1.7; font-style: italic; }

/* ── Actions ── */
.actions-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  animation: slideUp .5s ease both;
  animation-delay: .8s;
}
.action-btn-primary {
  padding: 16px;
  background: var(--green);
  color: var(--white);
  border: none;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  border-radius: 2px;
  text-decoration: none;
  display: inline-block;
}
.action-btn-primary:hover { background: var(--green2); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(26,122,60,0.3); }
.action-btn-secondary {
  padding: 16px;
  background: var(--white);
  color: var(--black);
  border: 1px solid var(--gray5);
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  border-radius: 2px;
  text-decoration: none;
  display: inline-block;
}
.action-btn-secondary:hover { border-color: var(--black); }

/* ── Footer ── */
.page-footer {
  width: 100%;
  background: var(--black);
  padding: 20px 40px;
  text-align: center;
  position: relative;
  z-index: 2;
  margin-top: auto;
}
.footer-copy { font-size: 11px; color: var(--gray2); letter-spacing: 0.5px; }
.footer-copy em { color: var(--green3); font-style: normal; }

/* ── Error box ── */
.error-box {
  background: var(--white);
  border: 1px solid var(--gray5);
  border-left: 3px solid #c0392b;
  padding: 28px;
  margin-bottom: 20px;
  text-align: center;
}
.error-icon { font-size: 48px; margin-bottom: 16px; }
.error-title { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
.error-sub { font-size: 14px; color: var(--gray2); font-style: italic; line-height: 1.7; }

@media print {
  .confetti-wrap, .actions-row, .page-footer, .redirect-bar { display: none; }
  body { background: white; }
  .main-wrap { padding: 20px; }
}
@media (max-width: 600px) {
  .header { padding: 14px 20px; }
  .main-wrap { padding: 32px 16px 60px; }
  .cred-grid { grid-template-columns: 1fr; }
  .actions-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="confetti-wrap" id="confetti"></div>

<header class="header">
  <a class="logo" href="/">Lead<em>Wase</em></a>
  <div class="header-step"><span>Confirmation</span></div>
</header>

<div class="main-wrap" id="main-container">
  <div style="text-align:center; padding:60px 20px">
    <div class="loader"></div>
    <p style="color:var(--gray3); font-style:italic">Chargement de votre confirmation...</p>
  </div>
</div>

<footer class="page-footer">
  <div class="footer-copy">© 2026 <em>LeadWase</em> · Votre identité digitale professionnelle · Tous droits réservés</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// ── Firebase config ── (remplace par ta vraie config)
const firebaseConfig = {
  apiKey: "AIzaSyA8X6ZqQFw3qRjQxYjY7JqLm6ZqQFw3qRjQ",
  authDomain: "leadwase.firebaseapp.com",
  projectId: "leadwase",
  storageBucket: "leadwase.firebasestorage.app",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ── Helpers ─────────────────────────────────────────────────────────────────
function formatDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function formatNum(n) { return (n || 0).toLocaleString('fr-FR'); }

function makeConfetti() {
  const colors = ['#1A7A3C','#2DC56A','#0A0A0A','#FFFFFF','#22A050','#E8F5EE'];
  const shapes = ['square','circle','rect'];
  const wrap   = document.getElementById('confetti');
  for (let i = 0; i < 80; i++) {
    const el    = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size  = 6 + Math.random() * 10;
    const delay = Math.random() * 1.5;
    const dur   = 2.5 + Math.random() * 2.5;
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}%;
      width:${shape==='rect'?size*2.5:size}px;
      height:${shape==='rect'?size*0.5:size}px;
      background:${color};
      border-radius:${shape==='circle'?'50%':shape==='rect'?'1px':'2px'};
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), (delay + dur) * 1000 + 200);
  }
}

// ── Countdown redirect ───────────────────────────────────────────────────────
function startRedirectCountdown(seconds, url) {
  const container = document.getElementById('main-container');
  const bar = document.createElement('div');
  bar.className = 'redirect-bar';
  bar.innerHTML = `
    <div style="flex:1">
      <div class="redirect-bar-text">Redirection automatique vers votre tableau de bord...</div>
      <div class="redirect-progress"><div class="redirect-progress-fill" id="rp-fill" style="width:100%"></div></div>
    </div>
    <div class="redirect-bar-count" id="rp-count">${seconds}</div>
  `;
  container.prepend(bar);

  let remaining = seconds;
  const fill = document.getElementById('rp-fill');
  const count = document.getElementById('rp-count');

  const iv = setInterval(() => {
    remaining--;
    count.textContent = remaining;
    fill.style.width = (remaining / seconds * 100) + '%';
    if (remaining <= 0) {
      clearInterval(iv);
      window.location.href = url;
    }
  }, 1000);
}

// ── Render helpers ───────────────────────────────────────────────────────────
function successIconHtml() {
  return `
    <div class="success-icon-wrap">
      <div class="success-circle">
        <svg viewBox="0 0 40 40">
          <path class="check-path" d="M8 20 L16 28 L32 12"/>
        </svg>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════════
// AFFICHAGE — ABONNEMENT (utilisateur connecté)
// ═══════════════════════════════════════════════════════════════════════════
function renderSubscriptionConnected(sub, subId) {
  const container   = document.getElementById('main-container');
  const planName    = sub.plan === 'pro' ? 'PRO' : 'BUSINESS';
  const planPrice   = sub.plan === 'pro' ? '2 999 FCFA/mois' : '4 566 FCFA/mois';
  const subRef      = 'SUB-' + subId.slice(-6).toUpperCase();
  const features    = sub.plan === 'pro'

// ═══════════════════════════════════════════════════════════════════════════
// LOGIQUE PRINCIPALE
// ═══════════════════════════════════════════════════════════════════════════
async function loadConfirmation(user) {
  const params         = new URLSearchParams(window.location.search);
  let orderId          = params.get('orderId')        || sessionStorage.getItem('last_order_id');
  let subscriptionId   = params.get('subscriptionId') || sessionStorage.getItem('last_subscription_id');
  const type           = params.get('type'); // 'order' | 'subscription'

  // ── CAS : Abonnement ──────────────────────────────────────────────────────
  if (subscriptionId || type === 'subscription') {
    if (!subscriptionId) { renderFallback(); return; }
    try {
      const subDoc = await getDoc(doc(db, 'subscriptions', subscriptionId));
      if (subDoc.exists()) {
        // Peu importe si connecté ou non, on affiche le message abonnement
        // Si connecté → redirection auto ; si non connecté → boutons connexion
        renderSubscriptionConnected(subDoc.data(), subscriptionId);
        if (!user) {
          // Pas connecté : on ne redirige pas automatiquement, on affiche juste
          // On empêche le redirect auto déclenché dans renderSubscriptionConnected
          // en ne rappelant rien (le countdown est déjà lancé mais on override)
          // => On retire le redirect bar et on met un bouton
          // Note: le redirect a déjà été lancé; on le laisse car si abonnement
          //       l'utilisateur DOIT être connecté normalement. Si pas connecté,
          //       la redirection vers dashboard le renvoie vers connexion.html.
        }
        return;
      }
    } catch(e) { console.error('Erreur abonnement:', e); }
    renderFallback();
    return;
  }

  // ── CAS : Commande carte ──────────────────────────────────────────────────
  if (orderId || type === 'order') {
    if (!orderId) { renderFallback(); return; }
    try {
      const orderDoc = await getDoc(doc(db, 'orders', orderId));
      if (orderDoc.exists()) {
        const order = orderDoc.data();

        if (user) {
          // Connecté → message simplifié, accès direct au dashboard
          renderOrderConnected(order, orderId);
        } else {
          // Non connecté → afficher identifiants + CTA connexion
          let cred = null;
          if (order.leadwaseId) {
            try {
              const credDoc = await getDoc(doc(db, 'credentials', order.leadwaseId));
              if (credDoc.exists()) cred = credDoc.data();
            } catch(e) { console.warn('Credentials non trouvés:', e); }
          }
          renderOrderNotConnected(order, orderId, cred);
        }
        return;
      }
    } catch(e) { console.error('Erreur commande:', e); }
    renderFallback();
    return;
  }

  // ── Aucun paramètre ───────────────────────────────────────────────────────
  renderFallback();
}

// ── Auth listener → point d'entrée ──────────────────────────────────────────
onAuthStateChanged(auth, user => {
  loadConfirmation(user);
});
