<!DOCTYPE html>
<html lang="fr">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadWase — Confirmation</title>
<style>
:root {
  --black:       #0A0A0A;
  --white:       #FFFFFF;
  --off:         #F8F8F6;
  --green:       #1A7A3C;
  --green2:      #22A050;
  --green3:      #2DC56A;
  --green-light: #E8F5EE;
  --gray2:       #555555;
  --gray3:       #999999;
  --gray5:       #EEEEEE;
  --serif: 'Times New Roman', Times, serif;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: var(--serif);
  background: var(--off);
  color: var(--black);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* ── Confetti ── */
.confetti-wrap { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
.confetti-piece {
  position:absolute; top:-16px;
  opacity:0; animation: fall linear forwards;
}
@keyframes fall {
  0%   { opacity:1; transform:translateY(0) rotate(0deg) scale(1); }
  80%  { opacity:1; }
  100% { opacity:0; transform:translateY(100vh) rotate(720deg) scale(.5); }
}

/* ── Header ── */
.header {
  width:100%; background:var(--black);
  border-bottom:3px solid var(--green);
  padding:16px 40px;
  display:flex; align-items:center; justify-content:space-between;
  position:relative; z-index:10;
}
.logo { font-family:var(--serif); font-size:23px; font-weight:bold; color:var(--white); letter-spacing:2px; text-transform:uppercase; text-decoration:none; }
.logo em { color:var(--green3); font-style:normal; }
.header-label { font-size:13px; color:var(--gray3); letter-spacing:2px; text-transform:uppercase; }
.header-label span { color:var(--green3); }

/* ── Main ── */
.main-wrap { width:100%; max-width:680px; padding:48px 24px 80px; position:relative; z-index:2; }

/* ── Loader ── */
.loader { width:40px; height:40px; border:3px solid var(--gray5); border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; margin:0 auto 20px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ── Animations ── */
@keyframes popIn  { from { opacity:0; transform:scale(.4); }    to { opacity:1; transform:scale(1); } }
@keyframes slideUp{ from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes drawCheck { to { stroke-dashoffset:0; } }

/* ── Success icon ── */
.success-icon-wrap { display:flex; justify-content:center; margin-bottom:32px; animation:popIn .6s cubic-bezier(.34,1.56,.64,1) both .2s; }
.success-circle {
  width:88px; height:88px; border-radius:50%; background:var(--green);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 12px rgba(26,122,60,.1), 0 0 0 24px rgba(26,122,60,.05);
}
.success-circle svg { width:40px; height:40px; stroke:var(--white); stroke-width:3; fill:none; stroke-linecap:round; stroke-linejoin:round; }
.check-path { stroke-dasharray:60; stroke-dashoffset:60; animation:drawCheck .5s ease forwards .6s; }

/* ── Title block ── */
.title-block { text-align:center; margin-bottom:36px; animation:slideUp .5s ease both .3s; }
.eyebrow {
  font-size:12px; letter-spacing:3px; text-transform:uppercase; color:var(--green);
  margin-bottom:10px; display:flex; align-items:center; justify-content:center; gap:8px;
}
.eyebrow::before, .eyebrow::after { content:''; display:block; width:28px; height:1px; background:var(--green); }
.main-title { font-size:clamp(32px,5vw,52px); font-weight:bold; color:var(--black); line-height:1.05; letter-spacing:-1px; margin-bottom:12px; }
.main-title em { color:var(--green); font-style:italic; }
.main-sub { font-size:18px; color:var(--gray2); line-height:1.8; font-style:italic; max-width:460px; margin:0 auto; }

/* ── Boîtes animées ── */
.a1 { animation:slideUp .5s ease both .45s; }
.a2 { animation:slideUp .5s ease both .55s; }
.a3 { animation:slideUp .5s ease both .60s; }
.a4 { animation:slideUp .5s ease both .65s; }
.a5 { animation:slideUp .5s ease both .70s; }
.a6 { animation:slideUp .5s ease both .80s; }

/* ── Recap box ── */
.box { background:var(--white); border:1px solid var(--gray5); margin-bottom:20px; }
.box-header { background:var(--black); padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
.bh-left { font-size:20px; font-weight:bold; color:var(--white); letter-spacing:1px; text-transform:uppercase; }
.bh-ref  { font-family:'Courier New',monospace; font-size:20px; color:var(--green3); letter-spacing:2px; }
.box-body { padding:28px; }
.row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px dotted var(--gray5); font-size:16px; }
.row:last-child { border-bottom:none; }
.rl { color:var(--gray2); }
.rv { font-weight:bold; color:var(--black); }
.rv.green { color:var(--green); }

/* ── Credentials box ── */
.cred-box { background:var(--black); padding:36px 28px; margin-bottom:20px; position:relative; overflow:hidden; }
.cred-box::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--green),var(--green3),var(--green)); }
.cred-title { font-size:16px; font-weight:bold; color:var(--white); letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
.cred-sub   { font-size:14px; color:var(--gray3); font-style:italic; margin-bottom:28px; line-height:1.6; }
.cred-grid  { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px; }
.cred-item  { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); padding:20px; }
.cred-label { font-size:10px; letter-spacing:2.5px; text-transform:uppercase; color:var(--gray3); margin-bottom:10px; }
.cred-value { font-family:'Courier New',monospace; font-size:23px; color:var(--green3); letter-spacing:3px; font-weight:bold; word-break:break-all; }
.cred-value.pwd { font-size:21px; color:var(--white); letter-spacing:2px; }
.cred-warn  { display:flex; align-items:flex-start; gap:12px; background:rgba(245,166,35,.08); border:1px solid rgba(245,166,35,.2); padding:16px; }
.cred-warn-icon { font-size:21px; flex-shrink:0; }
.cred-warn p { font-size:14px; color:rgba(245,166,35,.9); line-height:1.7; }
.cred-warn strong { font-weight:bold; }

/* ── Subscription hero ── */
.sub-hero { background:linear-gradient(135deg,#1a7a3c 0%,#0d5c2e 100%); padding:36px 28px; margin-bottom:20px; position:relative; overflow:hidden; text-align:center; }
.sub-hero::before { content:'⭐'; position:absolute; top:10px; right:20px; font-size:46px; opacity:.15; }
.sub-eyebrow { font-size:12px; letter-spacing:3px; text-transform:uppercase; color:rgba(255,255,255,.5); margin-bottom:8px; }
.sub-title   { font-size:28px; font-weight:bold; color:var(--white); margin-bottom:12px; }
.sub-badge   { display:inline-block; background:rgba(255,255,255,.2); padding:6px 18px; border-radius:30px; font-size:16px; font-weight:bold; color:var(--white); margin-bottom:16px; letter-spacing:1px; }
.sub-message { font-size:16px; color:rgba(255,255,255,.85); line-height:1.7; margin-bottom:20px; font-style:italic; }
.sub-features { text-align:left; display:inline-block; }
.sub-features li { font-size:20px; color:rgba(255,255,255,.85); padding:5px 0; list-style:none; }
.sub-features li::before { content:'✓'; margin-right:10px; font-weight:bold; color:var(--green3); }

/* ── Login CTA ── */
.login-cta { background:var(--white); border:2px solid var(--green); padding:32px 28px; margin-bottom:20px; text-align:center; position:relative; overflow:hidden; }
.login-cta::before { content:''; position:absolute; top:0; left:0; right:0; height:3px; background:linear-gradient(90deg,var(--green),var(--green3)); }
.lc-icon  { font-size:46px; margin-bottom:14px; }
.lc-title { font-size:23px; font-weight:bold; color:var(--black); margin-bottom:8px; }
.lc-sub   { font-size:16px; color:var(--gray2); line-height:1.7; font-style:italic; margin-bottom:24px; max-width:400px; margin-left:auto; margin-right:auto; }
.lc-steps { display:flex; flex-direction:column; gap:10px; margin-bottom:24px; text-align:left; max-width:360px; margin-left:auto; margin-right:auto; }
.lc-step  { display:flex; align-items:flex-start; gap:12px; font-size:20px; color:var(--gray2); }
.lc-num   { width:24px; height:24px; border-radius:50%; background:var(--green); color:var(--white); font-size:13px; font-weight:bold; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }

/* ── Next steps ── */
.next-steps { background:var(--white); border:1px solid var(--gray5); padding:32px 28px; margin-bottom:20px; }
.ns-title { font-size:18px; font-weight:bold; color:var(--black); margin-bottom:24px; padding-bottom:14px; border-bottom:1px solid var(--gray5); }
.ns-list  { display:flex; flex-direction:column; }
.ns-step  { display:flex; gap:18px; padding:16px 0; border-bottom:1px dotted var(--gray5); align-items:flex-start; }
.ns-step:last-child { border-bottom:none; padding-bottom:0; }
.ns-dot-col { display:flex; flex-direction:column; align-items:center; flex-shrink:0; }
.ns-dot { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:bold; }
.ns-dot.done    { background:var(--green); color:var(--white); }
.ns-dot.current { background:var(--black); color:var(--white); }
.ns-dot.pending { background:var(--gray5); color:var(--gray3); }
.ns-line { width:1px; flex:1; min-height:20px; background:var(--gray5); margin:4px 0; }
.ns-content   { padding-top:4px; }
.ns-step-title { font-size:16px; font-weight:bold; color:var(--black); margin-bottom:3px; }
.ns-step-desc  { font-size:14px; color:var(--gray2); line-height:1.7; font-style:italic; }
.ns-badge { display:inline-block; margin-top:4px; font-size:12px; color:var(--green); font-weight:bold; background:var(--green-light); padding:2px 8px; }

/* ── Info bar ── */
.info-bar { background:var(--green-light); border:1px solid rgba(26,122,60,.2); border-left:3px solid var(--green); padding:20px 24px; margin-bottom:20px; display:flex; gap:14px; align-items:flex-start; }
.info-icon  { font-size:25px; flex-shrink:0; }
.info-title { font-size:16px; font-weight:bold; color:var(--black); margin-bottom:4px; }
.info-sub   { font-size:14px; color:var(--gray2); line-height:1.7; font-style:italic; }

/* ── Redirect bar ── */
.redirect-bar { background:var(--black); padding:16px 24px; margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
.redirect-text  { font-size:20px; color:var(--gray3); font-style:italic; }
.redirect-count { font-size:25px; font-weight:bold; color:var(--green3); font-family:'Courier New',monospace; flex-shrink:0; }
.redirect-prog  { width:100%; height:3px; background:rgba(255,255,255,.08); margin-top:4px; }
.redirect-fill  { height:100%; background:var(--green3); transition:width 1s linear; }

/* ── Actions ── */
.actions-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; animation:slideUp .5s ease both .8s; }
.btn-primary {
  padding:16px; background:var(--green); color:var(--white); border:none;
  font-family:var(--serif); font-size:16px; font-weight:bold; letter-spacing:1px;
  text-transform:uppercase; cursor:pointer; transition:all .2s;
  text-align:center; border-radius:2px; text-decoration:none; display:inline-block;
}
.btn-primary:hover { background:var(--green2); transform:translateY(-2px); box-shadow:0 6px 18px rgba(26,122,60,.3); }
.btn-secondary {
  padding:16px; background:var(--white); color:var(--black); border:1px solid var(--gray5);
  font-family:var(--serif); font-size:16px; letter-spacing:.5px; cursor:pointer;
  transition:all .2s; text-align:center; border-radius:2px; text-decoration:none; display:inline-block;
}
.btn-secondary:hover { border-color:var(--black); }

/* ── Footer ── */
.page-footer { width:100%; background:var(--black); padding:20px 40px; text-align:center; z-index:2; margin-top:auto; }
.footer-copy { font-size:13px; color:var(--gray3); letter-spacing:.5px; }
.footer-copy em { color:var(--green3); font-style:normal; }

/* ── Fallback ── */
.fallback-box { background:var(--white); border:1px solid var(--gray5); border-left:3px solid #c0392b; padding:28px; margin-bottom:20px; text-align:center; }
.fallback-icon  { font-size:55px; margin-bottom:16px; }
.fallback-title { font-size:23px; font-weight:bold; margin-bottom:8px; }
.fallback-sub   { font-size:16px; color:var(--gray2); font-style:italic; line-height:1.7; }

@media print { .confetti-wrap,.actions-row,.page-footer,.redirect-bar { display:none; } body { background:white; } .main-wrap { padding:20px; } }
@media (max-width:600px) { .header { padding:14px 20px; } .main-wrap { padding:32px 16px 60px; } .cred-grid { grid-template-columns:1fr; } .actions-row { grid-template-columns:1fr; } }
</style>
</head>
<body>

<div class="confetti-wrap" id="confetti"></div>

<header class="header">
  <a class="logo" href="/">Lead<em>Wase</em></a>
  <div class="header-label"><span id="header-label">Confirmation</span></div>
</header>

<div class="main-wrap" id="main">
  <div style="text-align:center;padding:60px 20px">
    <div class="loader"></div>
    <p style="color:var(--gray3);font-style:italic">Chargement de votre confirmation…</p>
  </div>
</div>

<footer class="page-footer">
  <div class="footer-copy">© 2026 <em>LeadWase</em> · Votre identité digitale professionnelle · Tous droits réservés</div>
</footer>

<script>
// ── Utilitaires ──────────────────────────────────────────────────────────────
function formatDate(ms) {
  if (!ms) return '—';
  return new Date(ms).toLocaleDateString('fr-FR', {
    day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
}
function formatNum(n) { return (n || 0).toLocaleString('fr-FR'); }

function makeConfetti() {
  const colors = ['#1A7A3C','#2DC56A','#0A0A0A','#FFFFFF','#22A050','#E8F5EE'];
  const shapes = ['square','circle','rect'];
  const wrap   = document.getElementById('confetti');
  for (let i = 0; i < 80; i++) {
    const el    = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size  = 6 + Math.random() * 10;
    const delay = Math.random() * 1.5;
    const dur   = 2.5 + Math.random() * 2.5;
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}%;
      width:${shape==='rect'?size*2.5:size}px;
      height:${shape==='rect'?size*0.5:size}px;
      background:${color};
      border-radius:${shape==='circle'?'50%':shape==='rect'?'1px':'2px'};
      animation-duration:${dur}s;
      animation-delay:${delay}s;
    `;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), (delay + dur) * 1000 + 200);
  }
}

function startCountdown(seconds, url) {
  const bar = document.createElement('div');
  bar.className = 'redirect-bar';
  bar.innerHTML = `
    <div style="flex:1">
      <div class="redirect-text">Redirection automatique vers votre tableau de bord…</div>
      <div class="redirect-prog"><div class="redirect-fill" id="rf" style="width:100%"></div></div>
    </div>
    <div class="redirect-count" id="rc">${seconds}</div>`;
  document.getElementById('main').prepend(bar);
  let rem = seconds;
  const iv = setInterval(() => {
    rem--;
    document.getElementById('rc').textContent = rem;
    document.getElementById('rf').style.width = (rem / seconds * 100) + '%';
    if (rem <= 0) { clearInterval(iv); window.location.href = url; }
  }, 1000);
}

function successIcon() {
  return `<div class="success-icon-wrap">
    <div class="success-circle">
      <svg viewBox="0 0 40 40">
        <path class="check-path" d="M8 20 L16 28 L32 12"/>
      </svg>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════════════════════════════
// RENDU — ABONNEMENT
// Affiché UNIQUEMENT quand subscriptionId est présent.
// Aucune mention de carte, commande, livraison.
// ════════════════════════════════════════════════════════════════════════════
function renderSubscription(data, subId) {
  document.getElementById('header-label').textContent = 'Abonnement activé';
  sessionStorage.removeItem('last_subscription_id');

  const planName  = data.plan === 'pro' ? 'PRO' : 'BUSINESS';
  const planPrice = data.plan === 'pro' ? '2 999 FCFA/mois' : '4 566 FCFA/mois';
  const subRef    = 'SUB-' + subId.slice(-6).toUpperCase();
  const dateAct   = formatDate(data.paidAt || data.activatedAt || data.createdAt);

  const features = data.plan === 'pro'
    ? ['Photo de profil','Réseaux sociaux (LinkedIn, Instagram, TikTok…)','WhatsApp direct','Analytics de visites']
    : ['Photo de profil','Réseaux sociaux (LinkedIn, Instagram, TikTok…)','WhatsApp direct','Analytics de visites','Localisation / Adresse','Prise de rendez-vous','Avis Google','Formulaire de contact','Support prioritaire'];

  document.getElementById('main').innerHTML = `
    ${successIcon()}

    <div class="title-block">
      <div class="eyebrow">Abonnement activé</div>
      <h1 class="main-title">Bienvenue sur<br>votre formule <em>${planName} !</em></h1>
      <p class="main-sub">Votre abonnement est maintenant actif. Toutes les fonctionnalités sont débloquées immédiatement.</p>
    </div>

    <div class="box a1">
      <div class="box-header">
        <span class="bh-left">Récapitulatif abonnement</span>
        <span class="bh-ref">#${subRef}</span>
      </div>
      <div class="box-body">
        <div class="row"><span class="rl">Formule</span><span class="rv">${planName}</span></div>
        <div class="row"><span class="rl">Montant</span><span class="rv green">${planPrice} ✓</span></div>
        <div class="row"><span class="rl">Date d'activation</span><span class="rv">${dateAct}</span></div>
        <div class="row"><span class="rl">Renouvellement</span><span class="rv">Mensuel automatique</span></div>
        <div class="row"><span class="rl">Statut</span><span class="rv green">Actif ✓</span></div>
      </div>
    </div>

    <div class="sub-hero a2">
      <div class="sub-eyebrow">Fonctionnalités débloquées</div>
      <div class="sub-title">🎉 Félicitations !</div>
      <div class="sub-badge">${planName} — ${planPrice}</div>
      <div class="sub-message">Vous avez maintenant accès à :</div>
      <ul class="sub-features">${features.map(f=>`<li>${f}</li>`).join('')}</ul>
    </div>

    <div class="info-bar a3">
      <span class="info-icon">✨</span>
      <div>
        <div class="info-title">Accès immédiat à toutes vos fonctionnalités</div>
        <div class="info-sub">Votre plan ${planName} est actif. Rendez-vous sur votre tableau de bord pour personnaliser votre profil.</div>
      </div>
    </div>

    <div class="actions-row">
      <a href="dashboard.html" class="btn-primary">📱 Accéder à mon espace</a>
      <a href="offres.html"    class="btn-secondary">⭐ Voir les offres</a>
    </div>
  `;

  setTimeout(makeConfetti, 600);
  setTimeout(() => startCountdown(6, 'dashboard.html'), 800);
}

// ════════════════════════════════════════════════════════════════════════════
// RENDU — CARTE · utilisateur NON connecté
// Affiché UNIQUEMENT quand orderId est présent et aucun subscriptionId.
// Aucune mention d'abonnement, plan, fonctionnalités.
// ════════════════════════════════════════════════════════════════════════════
function renderOrderNotConnected(data, cred, orderId) {
  document.getElementById('header-label').textContent = 'Carte confirmée';
  sessionStorage.removeItem('last_order_id');

  const orderRef   = 'CMD-' + orderId.slice(-6).toUpperCase();
  const amountFmt  = data.amount ? formatNum(data.amount) + ' FCFA' : 'Sur devis';
  const fullName   = (data.firstName + ' ' + data.lastName).trim() || '—';
  const leadwaseId = cred?.leadwaseId || null;  // ← était loginEmail
  const pwd        = cred?.passwordHash || null;
  const dateAchat  = formatDate(data.createdAt);

  document.getElementById('main').innerHTML = `
    ${successIcon()}

    <div class="title-block">
      <div class="eyebrow">Carte enregistrée</div>
      <h1 class="main-title">Merci pour<br>votre <em>achat !</em></h1>
      <p class="main-sub">Votre carte LeadWase est en préparation. Voici le récapitulatif de votre achat.</p>
    </div>

    <div class="box a1">
      <div class="box-header">
        <span class="bh-left">Récapitulatif — Carte LeadWase</span>
        <span class="bh-ref">#${orderRef}</span>
      </div>
      <div class="box-body">
        <div class="row"><span class="rl">Produit</span><span class="rv">Carte LeadWase Classique</span></div>
        <div class="row"><span class="rl">Nom</span><span class="rv">${fullName}</span></div>
        <div class="row"><span class="rl">Téléphone</span><span class="rv">${data.phone || '—'}</span></div>
        <div class="row"><span class="rl">Adresse de livraison</span><span class="rv">${data.address || 'À renseigner'}</span></div>
        <div class="row"><span class="rl">Mode de paiement</span><span class="rv">Mobile Money / Wave</span></div>
        <div class="row"><span class="rl">Montant réglé</span><span class="rv green">${amountFmt} ✓</span></div>
        <div class="row"><span class="rl">Date d'achat</span><span class="rv">${dateAchat}</span></div>
      </div>
    </div>

    ${leadwaseId && pwd ? `
    <div class="cred-box a2">
      <div class="cred-title">🔑 Vos identifiants de connexion</div>
      <p class="cred-sub">Ces identifiants seront joints à votre carte physique. Conservez-les précieusement — ils donnent accès à votre profil digital LeadWase.</p>
      <div class="cred-grid">

  document.getElementById('main').innerHTML = `

  `;
}

// ════════════════════════════════════════════════════════════════════════════
// POINT D'ENTRÉE
//
// Règle de routage stricte :
//   1. subscriptionId présent → renderSubscription()   [jamais de mot "commande"]
//   2. orderId présent        → renderOrder*()          [jamais de mot "abonnement"]
//   3. aucun des deux         → renderFallback()
//
// Toutes les données viennent de /api/get-confirmation (admin SDK),
// jamais directement de Firestore côté client (bloqué par les Rules).
// ════════════════════════════════════════════════════════════════════════════
async function init() {
  const params         = new URLSearchParams(window.location.search);
  const subscriptionId = params.get('subscriptionId') || sessionStorage.getItem('last_subscription_id') || null;
  const orderId        = params.get('orderId')        || sessionStorage.getItem('last_order_id')        || null;

  // ── CAS 1 : ABONNEMENT ───────────────────────────────────────────────────
  if (subscriptionId) {
    try {
      const res  = await fetch(`/api/get-confirmation?subscriptionId=${encodeURIComponent(subscriptionId)}`);
      const json = await res.json();
      if (!res.ok || json.error) {
        renderFallback(json.error || 'Abonnement introuvable.');
        return;
      }
      renderSubscription(json.data, subscriptionId);
    } catch (e) {
      console.error(e);
      renderFallback('Impossible de charger votre abonnement.');
    }
    return;
  }

  // ── CAS 2 : COMMANDE CARTE ───────────────────────────────────────────────
  if (orderId) {
    try {
      const res  = await fetch(`/api/get-confirmation?orderId=${encodeURIComponent(orderId)}`);
      const json = await res.json();
      if (!res.ok || json.error) {
        renderFallback(json.error || 'Achat introuvable.');
        return;
      }

      // Déterminer si l'utilisateur est connecté via Firebase Auth
      // (import dynamique pour ne pas bloquer si Firebase échoue)
      let isConnected = false;
      try {
        const { initializeApp, getApps } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js');
        const { getAuth, onAuthStateChanged } = await import('https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js');
        const firebaseConfig = {
          apiKey:            "AIzaSyA8X6ZqQFw3qRjQxYjY7JqLm6ZqQFw3qRjQ",
          authDomain:        "leadwase.firebaseapp.com",
          projectId:         "leadwase",
          storageBucket:     "leadwase.firebasestorage.app",
          messagingSenderId: "123456789012",
          appId:             "1:123456789012:web:abc123def456",
        };
        const app  = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
        const auth = getAuth(app);
        isConnected = await new Promise(resolve => {
          const unsub = onAuthStateChanged(auth, user => { unsub(); resolve(!!user); });
        });
      } catch (authErr) {
        console.warn('Auth check échoué, on considère non connecté:', authErr);
      }

      if (isConnected) {
        renderOrderConnected(json.data, orderId);
      } else {
        renderOrderNotConnected(json.data, json.credentials, orderId);
      }
    } catch (e) {
      console.error(e);
      renderFallback('Impossible de charger votre achat.');
    }
    return;
  }

  // ── CAS 3 : Aucun ID ─────────────────────────────────────────────────────
  renderFallback('Aucun identifiant de transaction trouvé. Vérifiez le lien reçu par email.');
}

init();
</script>
