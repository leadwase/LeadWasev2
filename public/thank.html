<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadWase — Confirmation</title>
<style>
:root {
  --black:  #0A0A0A;
  --white:  #FFFFFF;
  --off:    #F8F8F6;
  --green:  #1A7A3C;
  --green2: #22A050;
  --green3: #2DC56A;
  --green-light: #E8F5EE;
  --gray1:  #2A2A2A;
  --gray2:  #555555;
  --gray3:  #999999;
  --gray4:  #CCCCCC;
  --gray5:  #EEEEEE;
  --serif: 'Times New Roman', Times, serif;
}

*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--serif);
  background: var(--off);
  color: var(--black);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  overflow-x: hidden;
}

.confetti-wrap {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.confetti-piece {
  position: absolute;
  top: -16px;
  width: 8px;
  height: 8px;
  opacity: 0;
  animation: fall linear forwards;
}
@keyframes fall {
  0%   { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translateY(100vh) rotate(720deg) scale(0.5); }
}

.header {
  width: 100%;
  background: var(--black);
  border-bottom: 3px solid var(--green);
  padding: 16px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.logo {
  font-family: var(--serif);
  font-size: 20px;
  font-weight: bold;
  color: var(--white);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.logo em { color: var(--green3); font-style: normal; }

.header-step {
  font-size: 11px;
  color: var(--gray3);
  letter-spacing: 2px;
  text-transform: uppercase;
}
.header-step span { color: var(--green3); }

.main-wrap {
  width: 100%;
  max-width: 680px;
  padding: 48px 24px 80px;
  position: relative;
  z-index: 2;
}

.success-icon-wrap {
  display: flex;
  justify-content: center;
  margin-bottom: 32px;
  animation: popIn .6s cubic-bezier(.34,1.56,.64,1) both;
  animation-delay: .2s;
}
@keyframes popIn {
  from { opacity:0; transform: scale(0.4); }
  to   { opacity:1; transform: scale(1); }
}

.success-circle {
  width: 88px;
  height: 88px;
  border-radius: 50%;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 0 0 0 12px rgba(26,122,60,0.1), 0 0 0 24px rgba(26,122,60,0.05);
}

.success-circle svg {
  width: 40px;
  height: 40px;
  stroke: var(--white);
  stroke-width: 3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.check-path {
  stroke-dasharray: 60;
  stroke-dashoffset: 60;
  animation: drawCheck .5s ease forwards;
  animation-delay: .6s;
}
@keyframes drawCheck {
  to { stroke-dashoffset: 0; }
}

.title-block {
  text-align: center;
  margin-bottom: 40px;
  animation: slideUp .5s ease both;
  animation-delay: .3s;
}
@keyframes slideUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}

.confirm-eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.confirm-eyebrow::before, .confirm-eyebrow::after {
  content: '';
  display: block;
  width: 28px;
  height: 1px;
  background: var(--green);
}

.confirm-title {
  font-family: var(--serif);
  font-size: clamp(32px, 5vw, 52px);
  font-weight: bold;
  color: var(--black);
  line-height: 1.05;
  letter-spacing: -1px;
  margin-bottom: 12px;
}
.confirm-title em { color: var(--green); font-style: italic; }

.confirm-sub {
  font-size: 16px;
  color: var(--gray2);
  line-height: 1.8;
  font-style: italic;
  max-width: 460px;
  margin: 0 auto;
}

.order-box {
  background: var(--white);
  border: 1px solid var(--gray5);
  margin-bottom: 20px;
  animation: slideUp .5s ease both;
  animation-delay: .45s;
}

.order-box-header {
  background: var(--black);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.obh-left {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: bold;
  color: var(--white);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.obh-num {
  font-family: 'Courier New', monospace;
  font-size: 13px;
  color: var(--green3);
  letter-spacing: 2px;
}

.order-box-body { padding: 28px; }

.order-detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px dotted var(--gray5);
  font-size: 14px;
}
.order-detail-row:last-child { border-bottom: none; }
.odl { color: var(--gray2); }
.odv { font-weight: bold; color: var(--black); }
.odv.green { color: var(--green); }

.credentials-box {
  background: var(--black);
  padding: 36px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  animation: slideUp .5s ease both;
  animation-delay: .55s;
}

.credentials-box::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--green) 0%, var(--green3) 50%, var(--green) 100%);
}

.cred-title {
  font-family: var(--serif);
  font-size: 14px;
  font-weight: bold;
  color: var(--white);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.cred-sub {
  font-size: 12px;
  color: var(--gray3);
  font-style: italic;
  margin-bottom: 28px;
  line-height: 1.6;
}

.cred-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 20px;
}

.cred-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  padding: 20px;
}

.cred-label {
  font-size: 9px;
  letter-spacing: 2.5px;
  text-transform: uppercase;
  color: var(--gray3);
  margin-bottom: 10px;
}

.cred-value {
  font-family: 'Courier New', monospace;
  font-size: 22px;
  color: var(--green3);
  letter-spacing: 3px;
  font-weight: bold;
}

.cred-value.pwd {
  font-size: 18px;
  color: var(--white);
  letter-spacing: 2px;
}

.cred-warning {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: rgba(245,166,35,0.08);
  border: 1px solid rgba(245,166,35,0.2);
  padding: 16px;
}

.cred-warning-icon { font-size: 18px; flex-shrink: 0; }
.cred-warning p {
  font-size: 12px;
  color: rgba(245,166,35,0.9);
  line-height: 1.7;
}
.cred-warning strong { font-weight: bold; font-style: normal; }

.subscription-box {
  background: linear-gradient(135deg, #1a7a3c 0%, #0d5c2e 100%);
  padding: 36px 28px;
  margin-bottom: 20px;
  position: relative;
  overflow: hidden;
  animation: slideUp .5s ease both;
  animation-delay: .55s;
  text-align: center;
}
.subscription-box::before {
  content: '⭐';
  position: absolute;
  top: 10px;
  right: 20px;
  font-size: 40px;
  opacity: 0.15;
}
.sub-title {
  font-family: var(--serif);
  font-size: 24px;
  font-weight: bold;
  color: var(--white);
  margin-bottom: 12px;
}
.sub-plan {
  display: inline-block;
  background: rgba(255,255,255,0.2);
  padding: 6px 18px;
  border-radius: 30px;
  font-size: 14px;
  font-weight: bold;
  color: var(--white);
  margin-bottom: 16px;
}
.sub-message {
  font-size: 14px;
  color: rgba(255,255,255,0.9);
  line-height: 1.7;
  margin-bottom: 20px;
}
.sub-features {
  text-align: left;
  display: inline-block;
  margin: 0 auto;
}
.sub-features li {
  font-size: 13px;
  color: rgba(255,255,255,0.85);
  padding: 6px 0;
  list-style: none;
}
.sub-features li::before {
  content: '✓';
  margin-right: 10px;
  font-weight: bold;
}

.next-steps {
  background: var(--white);
  border: 1px solid var(--gray5);
  padding: 32px 28px;
  margin-bottom: 20px;
  animation: slideUp .5s ease both;
  animation-delay: .65s;
}

.ns-title {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: bold;
  color: var(--black);
  margin-bottom: 24px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--gray5);
  display: flex;
  align-items: center;
  gap: 10px;
}

.ns-steps { display: flex; flex-direction: column; gap: 0; }

.ns-step {
  display: flex;
  gap: 18px;
  padding: 16px 0;
  border-bottom: 1px dotted var(--gray5);
  align-items: flex-start;
}
.ns-step:last-child { border-bottom: none; padding-bottom: 0; }

.ns-dot-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  flex-shrink: 0;
}

.ns-dot {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 13px;
  font-weight: bold;
  flex-shrink: 0;
}
.ns-dot.done { background: var(--green); color: var(--white); }
.ns-dot.pending { background: var(--gray5); color: var(--gray3); }
.ns-dot.waiting { background: var(--black); color: var(--white); }

.ns-line {
  width: 1px;
  flex: 1;
  min-height: 20px;
  background: var(--gray5);
  margin: 4px 0;
}

.ns-content { padding-top: 4px; }
.ns-step-title { font-family: var(--serif); font-size: 14px; font-weight: bold; color: var(--black); margin-bottom: 3px; }
.ns-step-desc { font-size: 12px; color: var(--gray2); line-height: 1.7; font-style: italic; }
.ns-step-time { display: inline-block; margin-top: 4px; font-size: 10px; color: var(--green); font-weight: bold; letter-spacing: 0.5px; background: var(--green-light); padding: 2px 8px; }

.delivery-box {
  background: var(--green-light);
  border: 1px solid rgba(26,122,60,0.2);
  border-left: 3px solid var(--green);
  padding: 20px 24px;
  margin-bottom: 20px;
  display: flex;
  gap: 14px;
  align-items: flex-start;
  animation: slideUp .5s ease both;
  animation-delay: .7s;
}
.del-icon { font-size: 22px; flex-shrink: 0; }
.del-text {}
.del-title { font-family: var(--serif); font-size: 14px; font-weight: bold; color: var(--black); margin-bottom: 4px; }
.del-sub { font-size: 12px; color: var(--gray2); line-height: 1.7; font-style: italic; }

.actions-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  animation: slideUp .5s ease both;
  animation-delay: .8s;
}

.action-btn-primary {
  padding: 16px;
  background: var(--green);
  color: var(--white);
  border: none;
  font-family: var(--serif);
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  border-radius: 2px;
  text-decoration: none;
  display: inline-block;
}
.action-btn-primary:hover { background: var(--green2); transform: translateY(-2px); box-shadow: 0 6px 18px rgba(26,122,60,0.3); }

.action-btn-secondary {
  padding: 16px;
  background: var(--white);
  color: var(--black);
  border: 1px solid var(--gray5);
  font-family: var(--serif);
  font-size: 14px;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: all .2s;
  text-align: center;
  border-radius: 2px;
  text-decoration: none;
  display: inline-block;
}
.action-btn-secondary:hover { border-color: var(--black); }

.page-footer {
  width: 100%;
  background: var(--black);
  padding: 20px 40px;
  text-align: center;
  position: relative;
  z-index: 2;
  margin-top: auto;
}
.footer-copy { font-size: 11px; color: var(--gray2); letter-spacing: 0.5px; }
.footer-copy em { color: var(--green3); font-style: normal; }

.loader {
  width: 40px;
  height: 40px;
  border: 3px solid var(--gray5);
  border-top-color: var(--green);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin: 0 auto 20px;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

.hidden { display: none; }

@media print {
  .confetti-wrap, .actions-row, .page-footer { display: none; }
  body { background: white; }
  .main-wrap { padding: 20px; }
}

@media (max-width: 600px) {
  .header { padding: 14px 20px; }
  .main-wrap { padding: 32px 16px 60px; }
  .cred-grid { grid-template-columns: 1fr; }
  .actions-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="confetti-wrap" id="confetti"></div>

<header class="header">
  <div class="logo">Lead<em>Wase</em></div>
  <div class="header-step">Confirmation</div>
</header>

<div class="main-wrap" id="main-container">
  <div style="text-align:center; padding:60px 20px">
    <div class="loader"></div>
    <p style="color:var(--gray3)">Chargement de votre confirmation...</p>
  </div>
</div>

<footer class="page-footer">
  <div class="footer-copy">© 2026 <em>LeadWase</em> · Votre identité digitale professionnelle · Tous droits réservés</div>
</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8X6ZqQFw3qRjQxYjY7JqLm6ZqQFw3qRjQ",
  authDomain: "leadwase.firebaseapp.com",
  projectId: "leadwase",
  storageBucket: "leadwase.firebasestorage.app",
  messagingSenderId: "123456789012",
  appId: "1:123456789012:web:abc123def456"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function formatDate(timestamp) {
  if (!timestamp) return '—';
  const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
  return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function formatNumber(n) {
  return (n || 0).toLocaleString('fr-FR');
}

function makeConfetti() {
  const colors = ['#1A7A3C','#2DC56A','#0A0A0A','#FFFFFF','#22A050','#E8F5EE'];
  const shapes = ['square','circle','rect'];
  const wrap = document.getElementById('confetti');
  const count = 80;

  for (let i = 0; i < count; i++) {
    const el = document.createElement('div');
    const color = colors[Math.floor(Math.random() * colors.length)];
    const shape = shapes[Math.floor(Math.random() * shapes.length)];
    const size = 6 + Math.random() * 10;
    const left = Math.random() * 100;
    const delay = Math.random() * 1.5;
    const duration = 2.5 + Math.random() * 2.5;

    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${left}%;
      width: ${shape === 'rect' ? size * 2.5 : size}px;
      height: ${shape === 'rect' ? size * 0.5 : size}px;
      background: ${color};
      border-radius: ${shape === 'circle' ? '50%' : shape === 'rect' ? '1px' : '2px'};
      animation-duration: ${duration}s;
      animation-delay: ${delay}s;
    `;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), (delay + duration) * 1000 + 200);
  }
}

async function loadConfirmation() {
  const urlParams = new URLSearchParams(window.location.search);
  let orderId = urlParams.get('orderId');
  let subscriptionId = urlParams.get('subscriptionId');
  let type = urlParams.get('type');

  const container = document.getElementById('main-container');

  // Récupérer depuis sessionStorage si pas dans l'URL
  if (!orderId && !subscriptionId) {
    orderId = sessionStorage.getItem('last_order_id');
    subscriptionId = sessionStorage.getItem('last_subscription_id');
  }

  // CAS 1: Abonnement
  if (subscriptionId || type === 'subscription') {
    let subId = subscriptionId;
    
    if (subId) {
      try {
        const subDoc = await getDoc(doc(db, 'subscriptions', subId));
        if (subDoc.exists()) {
          const sub = subDoc.data();
          const planName = sub.plan === 'pro' ? 'PRO' : 'BUSINESS';
          const planPrice = sub.plan === 'pro' ? '2 999 FCFA' : '4 566 FCFA';
          
          const features = sub.plan === 'pro' 
            ? ['Réseaux sociaux', 'WhatsApp direct', 'Analytics de visites']
            : ['Réseaux sociaux', 'WhatsApp direct', 'Analytics de visites', 'Localisation', 'Prise de rendez-vous', 'Avis Google', 'Formulaire de contact'];
          
          container.innerHTML = `
            <div class="success-icon-wrap">
              <div class="success-circle">
                <svg viewBox="0 0 40 40">
                  <path class="check-path" d="M8 20 L16 28 L32 12"/>
                </svg>
              </div>
            </div>

            <div class="title-block">
              <div class="confirm-eyebrow">Abonnement activé</div>
              <h1 class="confirm-title">Bienvenue sur<br>votre formule <em>${planName}</em> !</h1>
              <p class="confirm-sub">Votre abonnement est maintenant actif. Profitez de toutes les fonctionnalités exclusives.</p>
            </div>

            <div class="subscription-box">
              <div class="sub-title">🎉 Félicitations !</div>
              <div class="sub-plan">${planName} — ${planPrice}/mois</div>
              <div class="sub-message">Vous avez débloqué toutes les fonctionnalités premium :</div>
              <ul class="sub-features">
                ${features.map(f => `<li>${f}</li>`).join('')}
              </ul>
            </div>

            <div class="delivery-box">
              <span class="del-icon">✨</span>
              <div class="del-text">
                <div class="del-title">Déblocage immédiat</div>
                <div class="del-sub">Toutes les fonctionnalités ${planName} sont disponibles immédiatement sur votre espace personnel.</div>
              </div>
            </div>

            <div class="actions-row">
              <a href="dashboard.html" class="action-btn-primary">📱 Accéder à mon espace</a>
              <a href="offres.html" class="action-btn-secondary">⭐ Voir les offres</a>
            </div>
          `;
          
          setTimeout(makeConfetti, 700);
          sessionStorage.removeItem('last_subscription_id');
          return;
        }
      } catch(e) { 
        console.error('Erreur chargement abonnement:', e);
      }
    }
  }

  // CAS 2: Commande de carte
  if (orderId) {
    try {
      const orderDoc = await getDoc(doc(db, 'orders', orderId));
      if (orderDoc.exists()) {
        const order = orderDoc.data();
        const amountFormatted = order.amount ? formatNumber(order.amount) + ' FCFA' : 'Sur devis';
        const orderRef = 'CMD-' + orderId.slice(-6).toUpperCase();
        
        let loginEmail = null;
        let password = null;
        let leadwaseId = null;
        
        if (order.leadwaseId) {
          leadwaseId = order.leadwaseId;
          const credDoc = await getDoc(doc(db, 'credentials', order.leadwaseId));
          if (credDoc.exists()) {
            const cred = credDoc.data();
            loginEmail = cred.loginEmail || order.leadwaseId;
            password = cred.passwordHash || '—';
          }
        }
        
        container.innerHTML = `
          <div class="success-icon-wrap">
            <div class="success-circle">
              <svg viewBox="0 0 40 40">
                <path class="check-path" d="M8 20 L16 28 L32 12"/>
              </svg>
            </div>
          </div>

          <div class="title-block">
            <div class="confirm-eyebrow">Commande enregistrée</div>
            <h1 class="confirm-title">Merci pour<br>votre <em>commande !</em></h1>
            <p class="confirm-sub">Votre carte LeadWase est en préparation. Vous recevrez vos identifiants de connexion avec votre livraison.</p>
          </div>

          <div class="order-box">
            <div class="order-box-header">
              <span class="obh-left">Récapitulatif de commande</span>
              <span class="obh-num">#${orderRef}</span>
            </div>
            <div class="order-box-body">
              <div class="order-detail-row">
                <span class="odl">Produit</span>
                <span class="odv">Carte Classique LeadWase</span>
              </div>
              <div class="order-detail-row">
                <span class="odl">Nom</span>
                <span class="odv">${order.firstName || ''} ${order.lastName || ''}</span>
              </div>
              <div class="order-detail-row">
                <span class="odl">Email</span>
                <span class="odv">${order.email || '—'}</span>
              </div>
              <div class="order-detail-row">
                <span class="odl">Adresse de livraison</span>
                <span class="odv">${order.address || 'À renseigner'}</span>
              </div>
              <div class="order-detail-row">
                <span class="odl">Mode de paiement</span>
                <span class="odv">Mobile Money / Wave</span>
              </div>
              <div class="order-detail-row">
                <span class="odl">Montant payé</span>
                <span class="odv green">${amountFormatted} ✓</span>
              </div>
              <div class="order-detail-row">
                <span class="odl">Date de commande</span>
                <span class="odv">${formatDate(order.createdAt)}</span>
              </div>
            </div>
          </div>

          ${loginEmail ? `
          <div class="credentials-box">
            <div class="cred-title">Vos identifiants de connexion</div>
            <p class="cred-sub">Ces identifiants vous seront également remis avec votre carte physique. Conservez-les précieusement.</p>
            <div class="cred-grid">
              <div class="cred-item">
                <div class="cred-label">Identifiant unique</div>
                <div class="cred-value" id="cred-id">${loginEmail}</div>
              </div>
              <div class="cred-item">
                <div class="cred-label">Mot de passe</div>
                <div class="cred-value pwd" id="cred-pwd">${password}</div>
              </div>
            </div>
            <div class="cred-warning">
              <span class="cred-warning-icon">⚠️</span>
              <p><strong>Important :</strong> Notez ou prenez en photo ces informations maintenant. Elles vous permettront de vous connecter à votre profil digital sur <strong>leadwase.com</strong> dès réception de votre carte.</p>
            </div>
          </div>
          ` : ''}

          <div class="next-steps">
            <div class="ns-title">📋 Prochaines étapes</div>
            <div class="ns-steps">
              <div class="ns-step">
                <div class="ns-dot-wrap"><div class="ns-dot done">✓</div><div class="ns-line"></div></div>
                <div class="ns-content">
                  <div class="ns-step-title">Commande enregistrée</div>
                  <div class="ns-step-desc">Votre commande a bien été reçue et le paiement confirmé.</div>
                  <span class="ns-step-time">Fait — ${formatDate(order.createdAt)}</span>
                </div>
              </div>
              <div class="ns-step">
                <div class="ns-dot-wrap"><div class="ns-dot waiting">2</div><div class="ns-line"></div></div>
                <div class="ns-content">
                  <div class="ns-step-title">Préparation de votre carte</div>
                  <div class="ns-step-desc">Notre équipe prépare votre carte LeadWase personnalisée avec votre QR code et vos informations.</div>
                  <span class="ns-step-time">En cours — sous 24h</span>
                </div>
              </div>
              <div class="ns-step">
                <div class="ns-dot-wrap"><div class="ns-dot pending">3</div><div class="ns-line"></div></div>
                <div class="ns-content">
                  <div class="ns-step-title">Expédition & Livraison</div>
                  <div class="ns-step-desc">Votre carte sera expédiée avec votre document d'identifiants de connexion.</div>
                  <span class="ns-step-time">Prévu — sous 48h</span>
                </div>
              </div>
              <div class="ns-step">
                <div class="ns-dot-wrap"><div class="ns-dot pending">4</div></div>
                <div class="ns-content">
                  <div class="ns-step-title">Activation de votre profil</div>
                  <div class="ns-step-desc">À réception, connectez-vous sur leadwase.com avec vos identifiants et personnalisez votre profil digital.</div>
                  <span class="ns-step-time">À votre réception</span>
                </div>
              </div>
            </div>
          </div>

          <div class="delivery-box">
            <span class="del-icon">📦</span>
            <div class="del-text">
              <div class="del-title">Livraison estimée : 48h après validation</div>
              <div class="del-sub">Votre carte sera livrée à l'adresse indiquée. Vous serez contacté par SMS ou appel avant la livraison.</div>
            </div>
          </div>

          <div class="actions-row">
            <button class="action-btn-primary" onclick="window.print()">🖨 Imprimer la confirmation</button>
            <a href="connexion.html" class="action-btn-secondary">🔑 Aller à la page de connexion</a>
          </div>
        `;
        
        setTimeout(makeConfetti, 700);
        sessionStorage.removeItem('last_order_id');
        return;
      }
    } catch(e) { 
      console.error('Erreur chargement commande:', e);
    }
  }

  // CAS 3: Aucune information trouvée
  container.innerHTML = `
    <div class="title-block">
      <div class="confirm-eyebrow">Information</div>
      <h1 class="confirm-title">Confirmation <em>traitée</em></h1>
      <p class="confirm-sub">Votre paiement a bien été reçu. Vous recevrez un email de confirmation détaillé.</p>
    </div>
    <div class="actions-row">
      <a href="/" class="action-btn-primary">Accueil</a>
      <a href="connexion.html" class="action-btn-secondary">Connexion</a>
    </div>
  `;
}

loadConfirmation();
</script>
</body>
</html>
